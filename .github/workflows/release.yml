name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build rabbitmq-bridge (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }} -p rabbitmq-bridge
      - name: Package
        shell: bash
        run: |
          name="rabbitmq-bridge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rabbitmq-bridge" "dist/$name/"
          cp README.md COPYING LICENSE-MIT LICENSE-APACHE "dist/$name/"
          python3 scripts/third-party-licenses.py ${{ matrix.target }} > "dist/$name/THIRD-PARTY-LICENSES.txt"
          "dist/$name/rabbitmq-bridge" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.target }}
          path: dist/*.tar.gz*

  lisp:
    name: Package Emacs Lisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "29.1"
      - name: Package and verify package-install
        run: |
          scripts/package-lisp.sh dist
          cd dist
          for f in rabbitmq-*.tar; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: lisp
          path: dist/rabbitmq-*.tar*

  publish:
    name: Publish GitHub release
    needs: [build, lisp]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --notes "Experimental pre-release. Not production ready. See README.md, SECURITY.md and ROADMAP.md for known gaps."
