# Use the platform toolchain on macOS. Some Nix-provided `cc` wrappers lack
# libiconv, which breaks the aws-lc-sys build script.
[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[target.x86_64-apple-darwin]
linker = "/usr/bin/cc"

[env]
CC_aarch64_apple_darwin = "/usr/bin/cc"
CXX_aarch64_apple_darwin = "/usr/bin/c++"
CC_x86_64_apple_darwin = "/usr/bin/cc"
CXX_x86_64_apple_darwin = "/usr/bin/c++"
